apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-operator-configresolver
  namespace: dgemoli-ci-operator-debug
# ---
# kind: Role
# apiVersion: rbac.authorization.k8s.io/v1
# metadata:
#   name: ci-operator-configresolver
